name = "doposcuola-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "doposcuola-db"
database_id = "YOUR_D1_DATABASE_ID"   # sostituisci dopo: wrangler d1 create doposcuola-db

[vars]
FRONTEND_ORIGIN = "https://gestione-doposcuola-imola.pages.dev"
# Dopo aver aggiunto il dominio custom:
# FRONTEND_ORIGIN = "https://officinaimmaginata.it"

# Secrets (impostati via: wrangler secret put NOME)
# JWT_SECRET
# RESEND_API_KEY
# FROM_EMAIL
