<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doposcuola — Cooperativa Officina Immaginata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Titillium+Web:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ── Token System ─────────────────────────────────────────── */
:root {
  --blue:       #0B3954;
  --blue-mid:   #0d4568;
  --blue-lt:    #e8f1f6;
  --pacific:    #4ea5c0;
  --pacific-lt: #e8f5f9;
  --saffron:    #EDBC1D;
  --saffron-lt: #fef9e7;
  --terracotta: #E94F37;
  --terra-lt:   #fdecea;
  --white:      #FEFFFE;
  --carbon:     #1E1E1E;
  --slate:      #5a6a7a;
  --border:     #dce6ec;
  --bg:         #f4f8fb;

  --font-head: 'Poppins', sans-serif;
  --font-body: 'Titillium Web', sans-serif;
  --radius:    10px;
  --radius-lg: 16px;
  --shadow:    0 2px 12px rgba(11,57,84,0.08);
  --shadow-md: 0 4px 24px rgba(11,57,84,0.12);
}

/* ── Reset ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--carbon);
  background: var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--pacific); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Typography ──────────────────────────────────────────── */
h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 700; line-height: 1.2; }
h1 { font-size: 22px; }
h2 { font-size: 18px; }
h3 { font-size: 16px; }
.page-title { font-size: 22px; font-weight: 700; font-family: var(--font-head); }
.page-sub   { font-size: 13.5px; color: var(--slate); margin-top: 3px; font-family: var(--font-body); }

/* ── Layout ──────────────────────────────────────────────── */
#app { display: flex; flex-direction: column; min-height: 100vh; }

/* Topbar */
.topbar {
  background: var(--blue);
  height: 56px;
  padding: 0 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon {
  width: 34px;
  height: 34px;
  background: var(--terracotta);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.brand-icon i { font-size: 20px; color: var(--white); }
.brand-text { display: flex; flex-direction: column; }
.brand-name { font-family: var(--font-head); font-weight: 700; font-size: 14px; color: var(--white); line-height: 1.1; }
.brand-sub  { font-family: var(--font-body); font-size: 10.5px; color: var(--pacific); letter-spacing: 0.03em; line-height: 1; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.user-info { display: flex; align-items: center; gap: 8px; }
.user-name { font-family: var(--font-body); font-size: 13px; color: rgba(255,255,255,0.8); }
.role-pill { font-family: var(--font-head); font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 99px; letter-spacing: 0.04em; text-transform: uppercase; }
.role-admin     { background: var(--saffron); color: var(--blue); }
.role-genitore  { background: var(--pacific); color: var(--white); }
.role-operatore { background: #2d7a4f; color: var(--white); }

/* Body layout */
.body { display: flex; flex: 1; }

/* Sidebar */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 1rem 0;
}
.nav-section {
  font-family: var(--font-head);
  font-size: 9.5px;
  font-weight: 600;
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 12px 18px 5px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 18px;
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--slate);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  position: relative;
}
.nav-item i { font-size: 18px; flex-shrink: 0; }
.nav-item:hover { background: var(--bg); color: var(--blue); }
.nav-item.active {
  background: var(--blue-lt);
  color: var(--blue);
  border-left-color: var(--terracotta);
  font-weight: 600;
}

/* Content */
.content { flex: 1; padding: 1.75rem; overflow-y: auto; }

/* ── Cards ───────────────────────────────────────────────── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.375rem;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 1rem; }
.card-title {
  font-family: var(--font-head);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--blue);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 7px;
}
.card-title i { color: var(--pacific); font-size: 17px; }

/* ── Metrics ─────────────────────────────────────────────── */
.metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 1.5rem; }
.metric {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.125rem 1.25rem;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.metric::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--pacific);
}
.metric.accent::before { background: var(--terracotta); }
.metric.warn::before   { background: var(--saffron); }
.metric.danger::before { background: var(--terracotta); }
.metric-label { font-family: var(--font-body); font-size: 12px; color: var(--slate); margin-bottom: 6px; }
.metric-value { font-family: var(--font-head); font-size: 28px; font-weight: 700; color: var(--blue); line-height: 1; }
.metric-sub   { font-family: var(--font-body); font-size: 12px; color: var(--slate); margin-top: 4px; }

/* ── Table ───────────────────────────────────────────────── */
.table-wrap {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
}
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th {
  text-align: left;
  font-family: var(--font-head);
  font-size: 11px;
  font-weight: 600;
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 11px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; font-family: var(--font-body); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafcfe; }
.td-name { font-family: var(--font-head); font-weight: 600; font-size: 14px; color: var(--blue); }
.td-sub  { font-family: var(--font-body); font-size: 12px; color: var(--slate); margin-top: 2px; }

/* ── Badges ──────────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-head);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 99px;
}
.badge-success  { background: #e8f5f0; color: #1a6b3a; }
.badge-warning  { background: var(--saffron-lt); color: #7a5a00; }
.badge-danger   { background: var(--terra-lt); color: var(--terracotta); }
.badge-neutral  { background: var(--bg); color: var(--slate); border: 1px solid var(--border); }
.badge-blue     { background: var(--blue-lt); color: var(--blue); }
.badge-pacific  { background: var(--pacific-lt); color: #0d6a85; }

/* ── Buttons ─────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius);
  font-family: var(--font-head);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--white);
  color: var(--blue);
  transition: all 0.15s;
  line-height: 1;
}
.btn:hover { background: var(--bg); border-color: var(--pacific); }
.btn-primary {
  background: var(--blue);
  border-color: var(--blue);
  color: var(--white);
}
.btn-primary:hover { background: var(--blue-mid); border-color: var(--blue-mid); }
.btn-accent {
  background: var(--terracotta);
  border-color: var(--terracotta);
  color: var(--white);
}
.btn-accent:hover { background: #d4432d; border-color: #d4432d; }
.btn-sm { padding: 5px 11px; font-size: 12px; }
.btn-ghost { background: transparent; border-color: transparent; color: rgba(255,255,255,0.75); }
.btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--white); border-color: transparent; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Forms ───────────────────────────────────────────────── */
.form-group { margin-bottom: 1rem; }
.form-label {
  display: block;
  font-family: var(--font-head);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--blue);
  margin-bottom: 5px;
}
input[type=text], input[type=email], input[type=number],
input[type=date], input[type=password], select, textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: 14px;
  background: var(--white);
  color: var(--carbon);
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--pacific);
  box-shadow: 0 0 0 3px rgba(78,165,192,0.15);
}
input:disabled { background: var(--bg); opacity: 0.7; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }

/* ── Alerts ──────────────────────────────────────────────── */
.alert {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: 13.5px;
  margin-bottom: 1.25rem;
  border-left: 4px solid;
}
.alert i { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.alert-warning { background: var(--saffron-lt); color: #6b4c00; border-color: var(--saffron); }
.alert-warning i { color: var(--saffron); }
.alert-success  { background: #e8f5f0; color: #1a5c30; border-color: #4caf50; }
.alert-success i { color: #4caf50; }
.alert-info     { background: var(--pacific-lt); color: #0d5a72; border-color: var(--pacific); }
.alert-info i   { color: var(--pacific); }

/* ── Tabs ────────────────────────────────────────────────── */
.tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 1.5rem; gap: 0; }
.tab {
  padding: 9px 18px;
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  color: var(--slate);
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: color 0.15s;
}
.tab:hover { color: var(--blue); }
.tab.active { color: var(--terracotta); border-bottom-color: var(--terracotta); }

/* ── Page header ─────────────────────────────────────────── */
.page-header { margin-bottom: 1.75rem; }
.ph-row { display: flex; justify-content: space-between; align-items: flex-start; }
.ph-divider {
  height: 3px;
  width: 40px;
  background: var(--terracotta);
  border-radius: 2px;
  margin-top: 8px;
}

/* ── Saldo hero ──────────────────────────────────────────── */
.saldo-hero {
  text-align: center;
  padding: 2.5rem 1rem;
}
.saldo-ring {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 6px solid var(--pacific);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.25rem;
  background: var(--blue-lt);
}
.saldo-num   { font-family: var(--font-head); font-size: 48px; font-weight: 700; color: var(--blue); line-height: 1; }
.saldo-label { font-family: var(--font-body); font-size: 12px; color: var(--slate); margin-top: 2px; }

/* ── Week grid ───────────────────────────────────────────── */
.week-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; }
.week-day {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 8px;
  text-align: center;
  transition: border-color 0.15s;
}
.week-day.present {
  background: #e8f5f0;
  border-color: #a3d9b8;
}
.wd-name { font-family: var(--font-head); font-size: 10px; font-weight: 600; color: var(--slate); text-transform: uppercase; letter-spacing: 0.06em; }
.wd-num  { font-family: var(--font-head); font-size: 20px; font-weight: 700; color: var(--blue); margin: 4px 0; }
.wd-icon { font-size: 16px; }

/* ── Carnet cards ────────────────────────────────────────── */
.carnet-options { display: flex; flex-direction: column; gap: 12px; }
.carnet-card {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.125rem 1.375rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
  transition: border-color 0.15s, box-shadow 0.15s;
  cursor: pointer;
}
.carnet-card:hover { border-color: var(--pacific); box-shadow: var(--shadow-md); }
.carnet-card.best { border-color: var(--pacific); position: relative; }
.carnet-best-tag {
  position: absolute;
  top: -10px; right: 16px;
  background: var(--pacific);
  color: var(--white);
  font-family: var(--font-head);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 99px;
}
.carnet-pasti { font-family: var(--font-head); font-size: 22px; font-weight: 700; color: var(--blue); }
.carnet-sub   { font-family: var(--font-body); font-size: 12.5px; color: var(--slate); margin-top: 2px; }
.carnet-price { font-family: var(--font-head); font-size: 26px; font-weight: 700; color: var(--terracotta); }

/* ── Modal ───────────────────────────────────────────────── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(11,57,84,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 1rem;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--white);
  border-radius: 20px;
  padding: 1.75rem;
  width: 520px;
  max-width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(11,57,84,0.25);
}
.modal h3 {
  font-family: var(--font-head);
  font-size: 17px;
  font-weight: 700;
  color: var(--blue);
  margin-bottom: 1.375rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal h3 i { color: var(--terracotta); }
.modal-footer {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 1.375rem;
  padding-top: 1.125rem;
  border-top: 1px solid var(--border);
}

/* ── Login ───────────────────────────────────────────────── */
.login-page {
  min-height: 100vh;
  display: flex;
  background: var(--blue);
}
.login-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 3rem;
  position: relative;
  overflow: hidden;
}
.login-left::before {
  content: '';
  position: absolute;
  top: -100px; right: -100px;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: rgba(78,165,192,0.1);
}
.login-left::after {
  content: '';
  position: absolute;
  bottom: -80px; left: -60px;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: rgba(233,79,55,0.08);
}
.login-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 3rem;
  position: relative;
  z-index: 1;
}
.login-brand-icon {
  width: 48px;
  height: 48px;
  background: var(--terracotta);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-brand-icon i { font-size: 28px; color: var(--white); }
.login-brand-name { font-family: var(--font-head); font-size: 18px; font-weight: 700; color: var(--white); line-height: 1.2; }
.login-brand-sub  { font-family: var(--font-body); font-size: 12px; color: var(--pacific); }
.login-headline {
  font-family: var(--font-head);
  font-size: 36px;
  font-weight: 700;
  color: var(--white);
  line-height: 1.2;
  margin-bottom: 1rem;
  position: relative;
  z-index: 1;
}
.login-headline span { color: var(--saffron); }
.login-tagline {
  font-family: var(--font-body);
  font-size: 16px;
  color: rgba(255,255,255,0.65);
  line-height: 1.6;
  max-width: 380px;
  position: relative;
  z-index: 1;
}
.login-sedi {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 2.5rem;
  position: relative;
  z-index: 1;
}
.login-sede-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.8);
  font-family: var(--font-body);
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 99px;
}
.login-right {
  width: 440px;
  flex-shrink: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
.login-card {
  background: var(--white);
  border-radius: 20px;
  padding: 2rem;
  width: 100%;
  box-shadow: var(--shadow-md);
}
.login-card-title {
  font-family: var(--font-head);
  font-size: 20px;
  font-weight: 700;
  color: var(--blue);
  margin-bottom: 4px;
}
.login-card-sub {
  font-family: var(--font-body);
  font-size: 13.5px;
  color: var(--slate);
  margin-bottom: 1.75rem;
}
.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 1.125rem 0;
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--slate);
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.demo-btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

/* ── Toast ───────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 999;
  padding: 12px 18px;
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: 13.5px;
  display: none;
  align-items: center;
  gap: 9px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.15);
  max-width: 340px;
}

/* ── Spinner ─────────────────────────────────────────────── */
.spinner {
  display: inline-block;
  width: 20px; height: 20px;
  border: 2.5px solid var(--border);
  border-top-color: var(--pacific);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: flex; align-items: center; justify-content: center; padding: 3rem; gap: 12px; color: var(--slate); font-family: var(--font-body); }

/* ── Utilities ───────────────────────────────────────────── */
.flex-row { display: flex; gap: 10px; align-items: center; }
.flex-sb  { display: flex; justify-content: space-between; align-items: center; }
.mt-1 { margin-top: .75rem; }
.mt-2 { margin-top: 1.5rem; }
.fw-bold { font-weight: 600; }
.text-blue   { color: var(--blue); }
.text-slate  { color: var(--slate); }
.text-terra  { color: var(--terracotta); }
.text-sm { font-size: 12.5px; }
.info-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 1rem; }
.info-item .info-label { font-family: var(--font-head); font-size: 11px; font-weight: 600; color: var(--slate); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
.info-item .info-val   { font-family: var(--font-body); font-size: 14px; color: var(--carbon); }
.section-label {
  font-family: var(--font-head);
  font-size: 11px;
  font-weight: 600;
  color: var(--slate);
  text-transform: uppercase;

// ── Config ────────────────────────────────────────────────
const API = 'https://doposcuola-api.giulio-asta-2a5.workers.dev/api';

// ── State ─────────────────────────────────────────────────
const S = { user: null, token: null, page: null };
const _presenze = {};

// ── API client ────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (S.token) opts.headers['Authorization'] = `Bearer ${S.token}`;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (res.status === 401) { logout(); return null; }
  const ct = res.headers.get('Content-Type') || '';
  if (ct.includes('text/csv')) return res;
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Errore');
  return data;
}

// ── Boot ──────────────────────────────────────────────────
async function boot() {
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  if (token) {
    history.replaceState(null, '', location.pathname);
    try {
      const data = await api('GET', `/auth/verify?token=${token}`);
      if (data) { doLogin(data); return; }
    } catch(e) { toast('Link non valido o scaduto', 'danger'); }
  }
  const saved = sessionStorage.getItem('auth');
  if (saved) {
    const parsed = JSON.parse(saved);
    S.user = parsed.user; S.token = parsed.token;
    renderApp(); return;
  }
  renderLogin();
}

function doLogin(data) {
  S.user = data.user; S.token = data.token;
  sessionStorage.setItem('auth', JSON.stringify({ user: S.user, token: S.token }));
  renderApp();
}

function logout() {
  S.user = null; S.token = null;
  sessionStorage.removeItem('auth');
  renderLogin();
}

function presenza(id) { return _presenze[id]?.presente||false; }
function pasto(id)    { return _presenze[id]?.pasto||false; }

function togglePres(id, sede, btn, pfx, papfx) {
  if (!_presenze[id]) _presenze[id]={};
  _presenze[id].presente = !_presenze[id].presente;
  if (!_presenze[id].presente) _presenze[id].pasto=false;
  btn.innerHTML = _presenze[id].presente?'<i class="ti ti-check"></i> Presente':'Assente';
  btn.className = 'btn btn-sm'+(_presenze[id].presente?' btn-accent':'');
  const paBtn = document.getElementById((papfx||'btn-pa-')+id);
  if (paBtn) { paBtn.disabled=!_presenze[id].presente; if(!_presenze[id].presente){paBtn.innerHTML='Segna pasto';paBtn.className='btn btn-sm';} }
  api('POST','/presenze',{bambino_id:id,data:new Date().toISOString().split('T')[0],presente:_presenze[id].presente,pasto:false}).catch(()=>{});
}

function togglePasto(id, saldoId, btn) {
  if (!_presenze[id]) _presenze[id]={};
  _presenze[id].pasto=!_presenze[id].pasto;
  btn.innerHTML=_presenze[id].pasto?'<i class="ti ti-soup"></i> Segnato':'Segna pasto';

async function doExport(tipo) {
  const dal = document.getElementById(`exp-dal-${tipo}`)?.value||'';
  const al  = document.getElementById(`exp-al-${tipo}`)?.value||'';
  const url = `${API}/export?tipo=${tipo}${dal?`&dal=${dal}`:''}${al?`&al=${al}`:''}`;
  try {
    const res = await fetch(url, {headers:{Authorization:`Bearer ${S.token}`}});
    if (!res.ok) { toast('Errore export','danger'); return; }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `export_${tipo}_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    toast('Download avviato','success');
  } catch(e) { toast(e.message,'danger'); }
}

// ── Helpers ───────────────────────────────────────────────
function showModal(html) {
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">${html}</div>
    </div>`;
}
function closeModal() { document.getElementById('modal-root').innerHTML=''; }

let _toastTimer;
function toast(msg, type='success') {
  const cfg = {
    success:{ bg:'#e8f5f0', color:'#1a5c30', icon:'ti-check', border:'#4caf50' },
    warning:{ bg:'var(--saffron-lt)', color:'#6b4c00', icon:'ti-alert-triangle', border:'var(--saffron)' },
    danger: { bg:'var(--terra-lt)', color:'var(--terracotta)', icon:'ti-x', border:'var(--terracotta)' },
  };
  const c = cfg[type]||cfg.success;
  const el = document.getElementById('toast');
  Object.assign(el.style, {background:c.bg, color:c.color, borderLeft:`4px solid ${c.border}`, display:'flex', opacity:'1'});
  el.innerHTML = `<i class="ti ${c.icon}" style="font-size:18px;flex-shrink:0"></i> ${msg}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.style.display='none',300); }, 3500);
}

function formatData(d) {
  return new Date(d+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
