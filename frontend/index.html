<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Doposcuola — Officina Immaginata</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ---- Reset & tokens ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --blue:   #2563eb; --blue-dk: #1d4ed8; --blue-lt: #eff6ff;
  --green:  #16a34a; --green-lt: #f0fdf4;
  --amber:  #d97706; --amber-lt: #fffbeb;
  --red:    #dc2626; --red-lt:   #fef2f2;
  --slate:  #64748b;
  --bg:     #f8fafc;
  --card:   #ffffff;
  --border: #e2e8f0;
  --text:   #0f172a;
  --muted:  #94a3b8;
  --radius: 8px;
}
body { font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); min-height: 100vh; }

/* ---- Layout ---- */
#app { display: flex; flex-direction: column; min-height: 100vh; }
.topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 1.25rem; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
.topbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
.topbar-brand i { color: var(--blue); font-size: 22px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.user-chip { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--slate); }
.role-pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.role-admin     { background: #ede9fe; color: #6d28d9; }
.role-genitore  { background: var(--blue-lt); color: var(--blue); }
.role-operatore { background: var(--green-lt); color: var(--green); }
.body { display: flex; flex: 1; }
.sidebar { width: 210px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border); padding: 0.75rem 0; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 16px; font-size: 13.5px; color: var(--slate); cursor: pointer; border-left: 3px solid transparent; transition: background 0.1s; }
.nav-item i { font-size: 18px; }
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: var(--blue-lt); color: var(--blue); border-left-color: var(--blue); font-weight: 500; }
.nav-section { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 14px 16px 4px; font-weight: 600; }
.content { flex: 1; padding: 1.5rem; overflow-y: auto; max-width: 960px; }

/* ---- Components ---- */
.page-header { margin-bottom: 1.5rem; }
.page-header h1 { font-size: 20px; font-weight: 600; }
.page-header p  { color: var(--slate); font-size: 13px; margin-top: 3px; }
.ph-row { display: flex; justify-content: space-between; align-items: flex-start; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
.card + .card { margin-top: 1rem; }
.card-title { font-weight: 600; font-size: 14px; margin-bottom: 1rem; display: flex; align-items: center; gap: 7px; }
.card-title i { color: var(--blue); }

.metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 1.5rem; }
.metric { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; }
.metric-label { font-size: 12px; color: var(--slate); margin-bottom: 6px; }
.metric-value { font-size: 26px; font-weight: 700; line-height: 1; }
.metric-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--slate); text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 14px; background: var(--bg); border-bottom: 1px solid var(--border); }
td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafafa; }
.table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }

.badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
.badge-success { background: var(--green-lt); color: var(--green); }
.badge-warning { background: var(--amber-lt); color: var(--amber); }
.badge-danger  { background: var(--red-lt);   color: var(--red); }
.badge-neutral { background: var(--bg); color: var(--slate); border: 1px solid var(--border); }
.badge-blue    { background: var(--blue-lt); color: var(--blue); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13.5px; font-family: var(--font); cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 500; transition: background 0.1s; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-dk); }
.btn-sm { padding: 4px 10px; font-size: 12.5px; }
.btn-danger { background: var(--red-lt); border-color: #fecaca; color: var(--red); }
.btn-success { background: var(--green-lt); border-color: #bbf7d0; color: var(--green); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.form-group { margin-bottom: 1rem; }
.form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
input[type=text], input[type=email], input[type=number], input[type=date], input[type=password], select, textarea {
  width: 100%; padding: 8px 11px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13.5px; font-family: var(--font); background: var(--card); color: var(--text);
  transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
.flex-row { display: flex; gap: 10px; align-items: center; }
.flex-sb  { display: flex; justify-content: space-between; align-items: center; }

.alert { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--radius); font-size: 13.5px; margin-bottom: 1rem; }
.alert i { margin-top: 1px; flex-shrink: 0; }
.alert-warning { background: var(--amber-lt); color: #92400e; border: 1px solid #fde68a; }
.alert-success { background: var(--green-lt); color: #14532d; border: 1px solid #bbf7d0; }
.alert-info    { background: var(--blue-lt);  color: #1e3a8a; border: 1px solid #bfdbfe; }

.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; gap: 0; }
.tab { padding: 9px 16px; font-size: 13.5px; cursor: pointer; color: var(--slate); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }

.saldo-hero { text-align: center; padding: 2rem; }
.saldo-num { font-size: 64px; font-weight: 800; color: var(--blue); line-height: 1; }
.saldo-label { font-size: 16px; color: var(--slate); margin-top: 6px; }

.week-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; }
.week-day { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
.week-day.present { background: var(--green-lt); border-color: #bbf7d0; }
.week-day .wd-name { font-size: 10.5px; color: var(--muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; }
.week-day .wd-num  { font-size: 20px; font-weight: 700; margin: 4px 0; }
.week-day .wd-icon { font-size: 16px; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
.modal { background: var(--card); border-radius: 16px; padding: 1.5rem; width: 500px; max-width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; border-top: 1px solid var(--border); padding-top: 1rem; }

/* Login */
.login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
.login-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; width: 380px; max-width: 90vw; box-shadow: 0 4px 24px rgba(0,0,0,0.07); }
.login-logo { text-align: center; margin-bottom: 1.75rem; }
.login-logo i { font-size: 36px; color: var(--blue); }
.login-logo h1 { font-size: 20px; font-weight: 700; margin-top: 6px; }
.login-logo p  { font-size: 13px; color: var(--slate); margin-top: 4px; }
.divider { text-align: center; color: var(--muted); font-size: 12px; margin: 1rem 0; display: flex; align-items: center; gap: 10px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.demo-btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

/* Toast */
#toast { position: fixed; bottom: 20px; right: 20px; z-index: 999; padding: 11px 16px; border-radius: var(--radius); font-size: 13.5px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); transition: opacity 0.25s; pointer-events: none; }

/* Carnet cards */
.carnet-options { display: flex; flex-direction: column; gap: 10px; }
.carnet-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; }
.carnet-card:hover { border-color: var(--blue); }
.carnet-pasti { font-size: 22px; font-weight: 700; }
.carnet-sub   { font-size: 12px; color: var(--slate); }
.carnet-price { font-size: 24px; font-weight: 800; color: var(--blue); }

/* Spinner */
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 700px) {
  .sidebar { display: none; }
  .metrics { grid-template-columns: 1fr 1fr; }
  .grid2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" style="display:none"></div>

<script>
// ============================================================
// Config
// ============================================================
const API = 'https://doposcuola-api.giulio-asta-2a5.workers.dev/api'; // Cloudflare Pages proxia automaticamente verso il Worker

// ============================================================
// State
// ============================================================
const S = {
  user: null,
  token: null,
  page: null,
  sedi: [],
  cache: {},
};

// ============================================================
// API client
// ============================================================
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' },
  };
  if (S.token) opts.headers['Authorization'] = `Bearer ${S.token}`;
  if (body)    opts.body = JSON.stringify(body);

  const res = await fetch(API + path, opts);
  if (res.status === 401) { logout(); return null; }

  const ct = res.headers.get('Content-Type') || '';
  if (ct.includes('text/csv')) return res; // restituisce Response per CSV

  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Errore');
  return data;
}

// ============================================================
// Auth
// ============================================================
async function boot() {
  // Controlla magic link nel query string
  const params = new URLSearchParams(location.search);
  const token  = params.get('token');
  if (token) {
    history.replaceState(null, '', location.pathname);
    try {
      const data = await api('GET', `/auth/verify?token=${token}`);
      if (data) { doLogin(data); return; }
    } catch(e) { toast('Link non valido o scaduto', 'danger'); }
  }

  // Controlla sessione salvata
  const saved = sessionStorage.getItem('auth');
  if (saved) {
    const { user, token } = JSON.parse(saved);
    S.user = user; S.token = token;
    renderApp();
    return;
  }
  renderLogin();
}

function doLogin(data) {
  S.user  = data.user;
  S.token = data.token;
  sessionStorage.setItem('auth', JSON.stringify({ user: S.user, token: S.token }));
  renderApp();
}

function logout() {
  S.user = null; S.token = null; S.cache = {};
  sessionStorage.removeItem('auth');
  renderLogin();
}

// Demo login (bypassa API per sviluppo locale senza backend)
function demoLogin(role) {
  const users = {
    admin:    { id: 'demo-admin', name: 'Admin Demo', email: 'admin@officina.it', role: 'admin' },
    genitore: { id: 'demo-g1',    name: 'Marco Martini', email: 'marco@esempio.it', role: 'genitore' },
    operatore:{ id: 'demo-op1',   name: 'Sara Educatore', email: 'sara@officina.it', role: 'operatore', sede: 'orsini' },
  };
  doLogin({ user: users[role], token: 'demo-token' });
}

// ============================================================
// Render helpers
// ============================================================
function r(html) {
  document.getElementById('app').innerHTML = html;
}

function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

function navigate(page) {
  S.page = page;
  renderSidebar();
  const pages = {
    // admin
    dashboard: pageDashboard,
    iscritti:  pageIscritti,
    'pres-admin': pagePresenzeAdmin,
    pagamenti: pagePagamenti,
    operatori: pageOperatori,
    export:    pageExport,
    // genitore
    saldo:     pageSaldo,
    carnet:    pageCarnet,
    scheda:    pageScheda,
    'pres-genitore': pagePresenzeGenitore,
    // operatore
    presenze:  pagePresenze,
    pasti:     pagePasti,
    'bambini-op': pageBambiniOp,
    // common
    impostazioni: pageImpostazioni,
  };
  if (pages[page]) pages[page]();
}

// ============================================================
// Login page
// ============================================================
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-page">
      <div class="login-card">
        <div class="login-logo">
          <i class="ti ti-school"></i>
          <h1>Officina Immaginata</h1>
          <p>Gestione Doposcuola — Imola</p>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="login-email" placeholder="nome@esempio.it" autocomplete="email">
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="handleMagicLink()">
            <i class="ti ti-mail"></i> Ricevi magic link
          </button>
        </div>
        <div style="margin-top:1.25rem;text-align:center;font-size:13px;color:var(--slate)">
          Non hai un account? <a href="#" onclick="modalRegister();return false" style="color:var(--blue);font-weight:500">Registrati</a>
        </div>
        <div style="margin-top:1.5rem;border-top:1px solid var(--border);padding-top:1.25rem">
          <p style="font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:8px">Demo rapida:</p>
          <div class="demo-btns">
            <button class="btn btn-sm" onclick="demoLogin('admin')"><i class="ti ti-shield"></i> Admin</button>
            <button class="btn btn-sm" onclick="demoLogin('genitore')"><i class="ti ti-users"></i> Genitore</button>
            <button class="btn btn-sm" onclick="demoLogin('operatore')"><i class="ti ti-school"></i> Operatore</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

async function handleMagicLink() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { toast('Inserisci la tua email', 'warning'); return; }
  try {
    await api('POST', '/auth/magic-link', { email });
    toast('Magic link inviato! Controlla la tua email.', 'success');
  } catch(e) { toast(e.message, 'danger'); }
}

function modalRegister() {
  showModal(`
    <h3><i class="ti ti-user-plus"></i> Crea account</h3>
    <div class="grid2">
      <div class="form-group"><label class="form-label">Tuo nome</label><input type="text" id="r-name" placeholder="Mario Rossi"></div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" id="r-email" placeholder="email@esempio.it"></div>
    </div>
    <div class="form-group"><label class="form-label">Sede</label>
      <select id="r-sede"><option value="">-- Seleziona --</option>
        <option value="orsini">Orsini — IC7 Via Vivaldi 76</option>
        <option value="zennaro">Sante Zennaro — IC5 Via Pirandello 12</option>
        <option value="valsalva">Valsalva — IC4 Via Guicciardini 8</option>
        <option value="campanella">Campanella — IC4 Via Gioberti 1</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Orario frequenza</label>
      <select id="r-orario">
        <option value="13:00-17:00">13:00–17:00 (€190/mese)</option>
        <option value="14:00-17:00">14:00–17:00 (€150/mese)</option>
        <option value="12:45-16:45">12:45–16:45 (€75/mese)</option>
      </select>
    </div>
    <div class="grid2">
      <div class="form-group"><label class="form-label">Nome bambino/a</label><input type="text" id="r-bnome" placeholder="Nome"></div>
      <div class="form-group"><label class="form-label">Cognome bambino/a</label><input type="text" id="r-bcognome" placeholder="Cognome"></div>
    </div>
    <div class="form-group"><label class="form-label">Classe</label><input type="text" id="r-classe" placeholder="es. 3ª elementare"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="doRegister()">Registrati</button>
    </div>
  `);
}

async function doRegister() {
  const body = {
    name:           document.getElementById('r-name').value,
    email:          document.getElementById('r-email').value,
    sede_id:        document.getElementById('r-sede').value,
    orario:         document.getElementById('r-orario').value,
    nome_bambino:   document.getElementById('r-bnome').value,
    cognome_bambino:document.getElementById('r-bcognome').value,
    classe:         document.getElementById('r-classe').value,
  };
  try {
    await api('POST', '/auth/register', body);
    closeModal();
    toast('Registrazione completata! Controlla la tua email per accedere.', 'success');
  } catch(e) { toast(e.message, 'danger'); }
}

// ============================================================
// Main app shell
// ============================================================
function renderApp() {
  const u = S.user;
  const roleLabel = { admin: 'Amministratore', genitore: 'Genitore', operatore: 'Operatore' };
  document.getElementById('app').innerHTML = `
    <div id="topbar" class="topbar">
      <div class="topbar-brand"><i class="ti ti-school"></i> Officina Immaginata</div>
      <div class="topbar-right">
        <span class="user-chip">
          <i class="ti ti-user-circle" style="font-size:18px"></i>
          ${u.name}
          <span class="role-pill role-${u.role}">${roleLabel[u.role]}</span>
        </span>
        <button class="btn btn-sm" onclick="logout()"><i class="ti ti-logout"></i> Esci</button>
      </div>
    </div>
    <div class="body">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="content" id="content"><div style="text-align:center;padding:3rem"><div class="spinner"></div></div></main>
    </div>
  `;

  const defaultPage = { admin: 'dashboard', genitore: 'saldo', operatore: 'presenze' };
  navigate(defaultPage[u.role]);
}

function renderSidebar() {
  const navs = {
    admin: [
      { icon:'ti-layout-dashboard', label:'Dashboard',    page:'dashboard' },
      { icon:'ti-users',            label:'Iscritti',     page:'iscritti' },
      { icon:'ti-calendar-check',   label:'Presenze',     page:'pres-admin' },
      { icon:'ti-coin',             label:'Pagamenti',    page:'pagamenti' },
      { icon:'ti-user-cog',         label:'Operatori',    page:'operatori' },
      { icon:'ti-download',         label:'Esporta CSV',  page:'export' },
      { icon:'ti-settings',         label:'Impostazioni', page:'impostazioni' },
    ],
    genitore: [
      { icon:'ti-wallet',           label:'Saldo pasti',  page:'saldo' },
      { icon:'ti-ticket',           label:'Carnet',       page:'carnet' },
      { icon:'ti-id-badge',         label:'Scheda',       page:'scheda' },
      { icon:'ti-calendar',         label:'Presenze',     page:'pres-genitore' },
      { icon:'ti-settings',         label:'Impostazioni', page:'impostazioni' },
    ],
    operatore: [
      { icon:'ti-calendar-check',   label:'Presenze',     page:'presenze' },
      { icon:'ti-soup',             label:'Pasti',        page:'pasti' },
      { icon:'ti-users',            label:'Bambini',      page:'bambini-op' },
      { icon:'ti-settings',         label:'Impostazioni', page:'impostazioni' },
    ],
  };

  const items = navs[S.user.role] || [];
  document.getElementById('sidebar').innerHTML = items.map(n => `
    <div class="nav-item ${S.page === n.page ? 'active' : ''}" onclick="navigate('${n.page}')">
      <i class="ti ${n.icon}"></i> ${n.label}
    </div>
  `).join('');
}

// ============================================================
// Pages — Admin
// ============================================================
async function pageDashboard() {
  setContent('<div style="text-align:center;padding:3rem"><div class="spinner"></div></div>');
  // Per demo usiamo dati simulati; in produzione si farebbe una chiamata API di aggregazione
  const bambini = await getBambiniDemo();
  const saldoBasso = bambini.filter(b => b.saldo_pasti < 5).length;

  setContent(`
    <div class="page-header"><h1>Dashboard</h1><p>Panoramica del servizio doposcuola</p></div>

// Stato locale presenze (in produzione: sincronizzato con API)
const _presenze = {};
function presenza(id) { return _presenze[id]?.presente || false; }
function pasto(id)    { return _presenze[id]?.pasto || false; }

function togglePres(id, sede, btn) {
  if (!_presenze[id]) _presenze[id] = {};
  _presenze[id].presente = !_presenze[id].presente;
  if (!_presenze[id].presente) _presenze[id].pasto = false;
  btn.innerHTML = _presenze[id].presente ? '<i class="ti ti-check"></i> Presente' : 'Assente';
  btn.className = 'btn btn-sm' + (_presenze[id].presente ? ' btn-success' : '');
  const paBtn = document.getElementById('btn-pa-'+id);
  if (paBtn) paBtn.disabled = !_presenze[id].presente;
  // sync API
  api('POST', '/presenze', { bambino_id: id, data: new Date().toISOString().split('T')[0], presente: _presenze[id].presente, pasto: false }).catch(()=>{});
}

function togglePasto(id, sede, btn) {
  if (!_presenze[id]) _presenze[id] = {};
  _presenze[id].pasto = !_presenze[id].pasto;
  btn.innerHTML = _presenze[id].pasto ? '<i class="ti ti-soup"></i> Segnato' : 'Segna pasto';
  btn.className = 'btn btn-sm' + (_presenze[id].pasto ? ' btn-success' : '');
  const saldo = document.getElementById('saldo-'+id);
  if (saldo) {
    const n = parseInt(saldo.textContent) + (_presenze[id].pasto ? -1 : 1);
    saldo.textContent = Math.max(0,n);
    saldo.className = 'badge ' + (n < 5 ? 'badge-warning' : 'badge-neutral');
  }
  api('POST', '/presenze', { bambino_id: id, data: new Date().toISOString().split('T')[0], presente: true, pasto: _presenze[id].pasto }).catch(()=>{});
}

async function doExport(tipo) {
  const dal = document.getElementById(`exp-dal-${tipo}`)?.value || '';
  const al  = document.getElementById(`exp-al-${tipo}`)?.value  || '';
  const url = `/api/export?tipo=${tipo}${dal?`&dal=${dal}`:''}${al?`&al=${al}`:''}`;
  try {
    const res = await fetch(url, { headers: { Authorization: `Bearer ${S.token}` } });
    if (!res.ok) { toast('Errore export', 'danger'); return; }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `export_${tipo}_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    toast('Download avviato', 'success');
  } catch(e) { toast(e.message, 'danger'); }
}

function togglePresOp(id, sede, btn) { togglePres(id, sede, btn); }

function togglePastoOp(id, sede, btn) {
  if (!_presenze[id]) _presenze[id] = {};
  _presenze[id].pasto = !_presenze[id].pasto;
  btn.innerHTML = _presenze[id].pasto ? '<i class="ti ti-soup"></i> Segnato' : 'Segna pasto';
  btn.className = 'btn btn-sm' + (_presenze[id].pasto ? ' btn-success' : '');
  const saldo = document.getElementById('op-saldo-'+id);
  if (saldo) {
    const n = parseInt(saldo.textContent) + (_presenze[id].pasto ? -1 : 1);
    saldo.textContent = Math.max(0,n);
    saldo.className = 'badge ' + (n < 5 ? 'badge-warning' : 'badge-neutral');
  }
}

async function salvaPres(sedeId) {
  const bambini = (await getBambiniDemo()).filter(b=>b.sede_id===sedeId);
  const oggi = new Date().toISOString().split('T')[0];
  const payload = bambini.map(b=>({
    bambino_id: b.id, data: oggi,
    presente: presenza(b.id), pasto: pasto(b.id),
  }));
  try {
    for (const p of payload) await api('POST', '/presenze', p);
    toast('Registro salvato e saldi aggiornati', 'success');
  } catch(e) { toast(e.message, 'danger'); }
}

// ============================================================

function showModal(html) {
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">${html}</div>
    </div>`;
}

function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
}

let _toastTimer;
function toast(msg, type='success') {
  const cfg = {
    success: { bg:'var(--green-lt)',  color:'var(--green)', icon:'ti-check' },
    warning: { bg:'var(--amber-lt)',  color:'var(--amber)', icon:'ti-alert-triangle' },
    danger:  { bg:'var(--red-lt)',    color:'var(--red)',   icon:'ti-x' },
  };
  const c = cfg[type] || cfg.success;
  const el = document.getElementById('toast');
  el.style.background = c.bg; el.style.color = c.color; el.style.display = 'flex'; el.style.opacity = '1';
  el.innerHTML = `<i class="ti ${c.icon}"></i> ${msg}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.style.display='none', 300); }, 3500);
}

function formatData(d) {
  return new Date(d+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

function capitalise(s) { return s.charAt(0).toUpperCase()+s.slice(1); }
